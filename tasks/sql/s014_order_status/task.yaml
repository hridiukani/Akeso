id: s014_order_status
kind: sql
description: >
  Two mistakes: MAX(status) picks the alphabetically last status ('shipped' beats
  'delivered') instead of the most recent event, and there's no cut-off, so events after
  2026-06-30 (late-June orders shipped in July) count. Hardened in calibration (it was a
  one-line fix).
editable_paths: [solution.sql]
split: dev
difficulty: medium
tags: [latest-per-group, wrong-ordering, as-of-date]
sql:
  question: How many June 2026 orders were in each status at the end of 2026-06-30?
  as_of: 2026-06-30
  dataset: store
  seed: 46
  hidden_seed: 946
  order_matters: false
  float_precision: 2
# Overfitting: status histories differ on the hidden database. Fixing only one of the two
# mistakes fails on both databases.
