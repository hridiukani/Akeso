id: s012_top_products
kind: sql
description: >
  Two mistakes: units kept subtract returns via a join on returns, which repeats an order
  line once per return row, so lines returned in two parts count their quantity twice;
  and ROW_NUMBER gives tied products different ranks (ties must share a rank, ordered by
  name). Hardened in calibration (it was a one-word fix).
editable_paths: [solution.sql]
