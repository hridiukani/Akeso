id: r001_humanize_naturalsize
kind: code
description: >
  naturalsize() picks the unit (kB, MB, ...) from the unrounded size, then rounds the
  number, so 999999 bytes reads "1000.0 kB" instead of "1.0 MB" (same for binary and
  GNU styles). The upstream fix steps up one unit when rounding reaches the base.
editable_paths: [src/]
hidden_tests_dir: hidden_tests
solution_dir: solution
split: dev
difficulty: medium
source: real
