id: r006_boltons_indexedset
kind: code
description: >
  IndexedSet negative indexes past the start wrap around instead of raising IndexError:
  __getitem__ adds len() and then _get_real_index adds it again, so s[-4] on a 3-item set
  returns an item; pop(-n-k) likewise removes the wrong item. The fix bounds-checks in
  the shared _get_real_index (which also accounts for removed 'dead' slots).
editable_paths: [src/]
