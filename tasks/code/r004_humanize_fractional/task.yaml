id: r004_humanize_fractional
kind: code
description: >
  fractional() splits off the whole number, then turns the rest into a fraction with
  limit_denominator(1000). When that rest rounds to a whole (2.9999999 -> 1/1), the
  special case only covers exact integers, so it prints "2 1/1" (and "0/1"-style output
  for other inputs). The upstream fix folds a whole-number fraction into the integer part.
editable_paths: [src/]
