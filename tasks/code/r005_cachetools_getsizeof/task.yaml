id: r005_cachetools_getsizeof
kind: code
description: >
  With getsizeof set, Cache.__setitem__ reserves room for the full new size of a value
  even when the key is already cached, although the current size already includes the
  key's old value. Growing an existing entry therefore evicts other entries that would
  still fit (upstream issue #405). The fix reserves only the size difference.
