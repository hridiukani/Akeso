id: r003_boltons_daterange
kind: code
description: >
  daterange() with a month or year step does its month arithmetic on 1-based months with
  divmod(month + step, 12), so stepping into December lands in the wrong year, and steps
  of 12 or more months go wrong. Upstream issue #319. The fix folds years into months and
  does the arithmetic on 0-based months.
editable_paths: [src/]
hidden_tests_dir: hidden_tests
