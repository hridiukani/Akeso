[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repair_agent"
version = "0.1.0"
description = "A sandboxed agent that repairs code and SQL, with a measured eval suite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "openai",
    "pytest",
    "docker",
    "jsonschema",
]

[tool.pytest.ini_options]
# Only the harness's own tests. Task folders contain deliberately failing tests.
testpaths = ["tests"]
# Makes test helpers (tests/fakes.py) importable as `from fakes import ...` in any
# import mode, without relying on pytest adding the test folder to sys.path itself.
pythonpath = ["tests"]
# A typo like @pytest.mark.dokcer becomes an error instead of a silently unmarked test.
addopts = "--strict-markers"
markers = [
    "docker: needs Docker running and the repair-agent-code image built (quick run: -m \"not docker\")",
]
